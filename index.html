<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Tanda Tangan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#1a1a1a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.card{background:#1e1e1e;border:1px solid #2e2e2e;border-radius:14px;width:100%;max-width:380px;overflow:hidden;}
.head{padding:18px 20px 14px;border-bottom:1px solid #2a2a2a;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.head h1{font-size:16px;font-weight:500;color:#fff;line-height:1.3;}
.head p{font-size:11px;color:#555;margin-top:2px;}
.badge{display:flex;align-items:center;gap:5px;background:#0d2818;border:1px solid #1a5c32;border-radius:99px;padding:4px 10px;flex-shrink:0;}
.dot{width:6px;height:6px;background:#22c55e;border-radius:50%;}
.badge span{font-size:10.5px;color:#4ade80;font-weight:500;white-space:nowrap;}
.body{padding:6px 20px 14px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #242424;gap:12px;}
.row:last-child{border-bottom:none;}
.lbl{font-size:12px;color:#555;}
.val{font-size:13px;font-weight:600;color:#fff;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.foot{background:#181818;border-top:1px solid #242424;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}
.foot p{font-size:10px;color:#444;}
.seal{font-size:10px;color:#3b82f6;font-weight:600;letter-spacing:.06em;}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div><h1>Verifikasi Tanda Tangan</h1><p>Dokumen elektronik resmi</p></div>
    <div class="badge"><div class="dot"></div><span>Terverifikasi</span></div>
  </div>
  <div class="body">
    <div class="row"><span class="lbl">Nama</span><span class="val" id="v-nama">Sahrudin</span></div>
    <div class="row"><span class="lbl">Jabatan</span><span class="val" id="v-jabatan">HR Manager</span></div>
    <div class="row"><span class="lbl">No. Karyawan</span><span class="val" id="v-nip">201511.004</span></div>
    <div class="row"><span class="lbl">Perusahaan</span><span class="val" id="v-perusahaan">PT Purnama Karya Bersama</span></div>
    <div class="row"><span class="lbl">Tanggal</span><span class="val" id="v-tanggal">26/05/2026</span></div>
  </div>
  <div class="foot"><p>Scan QR untuk verifikasi ulang</p><span class="seal">e-SIGN</span></div>
</div>
<script>
const p=new URLSearchParams(window.location.search);
function s(id,k){const e=document.getElementById(id),v=p.get(k);if(e&&v)e.textContent=decodeURIComponent(v);}
s('v-nama','nama');s('v-jabatan','jabatan');s('v-nip','nip');s('v-perusahaan','perusahaan');s('v-tanggal','tanggal');
const n=p.get('nama');if(n)document.title='Verifikasi — '+decodeURIComponent(n);
</script>
</body>
</html>
